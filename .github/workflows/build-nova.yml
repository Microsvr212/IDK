
name: Build NOVA for Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build NOVA.exe
        run: |
          pyinstaller --onefile --windowed --name NOVA fortnite_optimizer.py

      - name: Upload NOVA.exe
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Windows
          path: dist/NOVA.exe
